<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Assets are built with relative URLs (vite base "./"), and pages live
         at nested routes like /room/ABCD, so they need a base to resolve
         against. Under a path prefix the server puts its own <base> above
         this one, and the first <base> in a document wins. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No Filter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Big+Shoulders+Display:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Anton&family=Baloo+2:wght@700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Audiowide&family=Chakra+Petch:wght@500;600;700&family=Oswald:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
